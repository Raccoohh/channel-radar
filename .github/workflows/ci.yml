name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: ruff check . && ruff format --check .
      - run: pytest
      - run: alembic upgrade head && alembic check && alembic downgrade base && alembic upgrade head
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: radar
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U radar"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://radar:local-ci-only@localhost:5432/radar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: alembic upgrade head && alembic check
      - run: python scripts/postgres_smoke.py
      - run: alembic downgrade base && alembic upgrade head
